version: '3.8'

services:
  # RideLink Unified Fullstack App (React Frontend + Spring Boot Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
    container_name: ridelink-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # AWS RDS MySQL Configuration (set in your .env)
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-rideshare}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_URL: ${DB_URL:-}
      DB_USE_SSL: ${DB_USE_SSL:-false}
      # Application Secrets
      JWT_SECRET: ${JWT_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
