server.port=${PORT:8080}

# MySQL Database Configuration (Supports AWS RDS via DB_URL or separate DB_HOST / DB_PORT / DB_NAME)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rideshare}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Cloud-resilient settings for AWS RDS)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart & Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}

# Geoapify Map Configuration
geoapify.api-key=${GEOAPIFY_API_KEY}

# Chat Message Encryption (AES-256 GCM)
app.chat.encryption-key=${CHAT_ENCRYPTION_KEY:${app.jwt.secret:9a6747f3c18c6bc3634125b2511f70caeb5ce3d5e7b3fe694710024790fb49b1}}
